---
- name: "Rule3"
  hosts: all
  sources:
    - ansible.eda.range:
        limit: 10
        batch_count: 5
        delay: 1
  rules:
    - name: Rule 3 Job event
      condition: event.payload.name == "rule3"
      action:
        run_job_template:
          name: "Job3"
          organization: Default
