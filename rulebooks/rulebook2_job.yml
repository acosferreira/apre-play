---
- name: "Rule2"
  hosts: all
  sources:
    - ansible.eda.range:
        limit: 10
        batch_count: 5
        delay: 1
  rules:
    - name: event is defined run job template
      condition: event.body is defined
      action:
        run_job_template:
          name: "Demo Job Template"
          organization: Default
